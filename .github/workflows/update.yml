name: Veille Automatique FMHY French

on:
  schedule:
    - cron: '0 0 * * *' # S'exécute automatiquement chaque nuit à minuit (UTC)
  workflow_dispatch: # Permet de lancer le script manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération des fichiers du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Exécution du script de veille
        run: python update_french.py

      - name: Enregistrement et publication des modifications
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-update FMHY French section"
          git push
          
