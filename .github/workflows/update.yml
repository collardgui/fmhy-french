name: Update FMHY French Page

on:
  schedule:
    # Exécution automatique chaque jour à minuit
    - cron: '0 0 * * *'
  workflow_dispatch: # Permet de lancer le script manuellement

permissions:
  contents: write # ⚠️ OBLIGATOIRE pour autoriser le bot à modifier index.md

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Exécuter le script d'extraction
        run: python update_french.py

      - name: Commiter et pousser les modifications
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique de index.md" && git push)
